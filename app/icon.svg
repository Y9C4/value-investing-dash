<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The site's one idea at 16px: price-implied return against the required
       return. Brass centre line = required; teal right = implies more (cheap),
       rust left = implies less (dear). -->
  <rect width="32" height="32" rx="6" fill="#141210"/>
  <rect x="16" y="8" width="11" height="6" fill="#0ea48c"/>
  <rect x="7" y="18" width="9" height="6" fill="#d6683c"/>
  <rect x="15" y="5" width="2" height="22" fill="#c9a45a"/>
</svg>
